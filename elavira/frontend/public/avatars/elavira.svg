<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with tech pattern -->
  <defs>
    <pattern id="techPatternElavira" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#FFB6C1" opacity="0.3"/>
      <rect x="8" y="8" width="4" height="4" fill="none" stroke="#FFB6C1" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <radialGradient id="backgroundGradientElavira" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#E91E63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C2185B;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="auraGradientElavira" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#FFB6C1;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FFB6C1;stop-opacity:0.2" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="100" cy="100" r="100" fill="url(#backgroundGradientElavira)"/>
  <circle cx="100" cy="100" r="100" fill="url(#techPatternElavira)"/>
  
  <!-- Aura behind head -->
  <circle cx="100" cy="80" r="60" fill="url(#auraGradientElavira)"/>
  
  <!-- Head -->
  <ellipse cx="100" cy="85" rx="35" ry="40" fill="#F5F5DC"/>
  
  <!-- Hair -->
  <path d="M 65 60 Q 70 45 80 50 Q 90 45 100 50 Q 110 45 120 50 Q 130 45 135 60 Q 130 70 120 65 Q 110 70 100 65 Q 90 70 80 65 Q 70 70 65 60 Z" fill="#8B4513"/>
  
  <!-- Eyes -->
  <ellipse cx="90" cy="80" rx="4" ry="6" fill="#8B4513"/>
  <ellipse cx="110" cy="80" rx="4" ry="6" fill="#8B4513"/>
  <ellipse cx="90" cy="78" rx="2" ry="3" fill="#000"/>
  <ellipse cx="110" cy="78" rx="2" ry="3" fill="#000"/>
  
  <!-- Eyebrows -->
  <path d="M 85 72 Q 90 70 95 72" stroke="#8B4513" stroke-width="2" fill="none"/>
  <path d="M 105 72 Q 110 70 115 72" stroke="#8B4513" stroke-width="2" fill="none"/>
  
  <!-- Nose -->
  <ellipse cx="100" cy="85" rx="3" ry="4" fill="#F5F5DC"/>
  
  <!-- Mouth (smile) -->
  <path d="M 95 90 Q 100 95 105 90" stroke="#8B4513" stroke-width="2" fill="none"/>
  
  <!-- Professional uniform -->
  <rect x="70" y="120" width="60" height="50" fill="#F5F5DC" rx="5"/>
  
  <!-- Collar -->
  <path d="M 85 120 L 100 130 L 115 120 L 100 125 Z" fill="#E91E63"/>
  
  <!-- Shoulder stripes -->
  <rect x="70" y="120" width="60" height="8" fill="#E91E63"/>
  
  <!-- Sleeve accents -->
  <rect x="70" y="125" width="8" height="40" fill="#E91E63"/>
  <rect x="122" y="125" width="8" height="40" fill="#E91E63"/>
  
  <!-- Chest emblem -->
  <circle cx="100" cy="140" r="8" fill="#E91E63"/>
  <circle cx="100" cy="140" r="5" fill="#F5F5DC"/>
  <line x1="100" y1="130" x2="100" y2="135" stroke="#E91E63" stroke-width="2"/>
  
  <!-- Name banner -->
  <rect x="20" y="170" width="160" height="25" fill="#C2185B" rx="12"/>
  <text x="100" y="185" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">ELAVIRA</text>
</svg>
