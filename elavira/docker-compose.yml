version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: elaviradb
      POSTGRES_USER: mon_user
      POSTGRES_PASSWORD: mon_password
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"

  ollama:
    image: ollama/ollama
    container_name: elavira-ollama-1
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    restart: always

  backend:
    build: ./backend
    container_name: elavira-backend-1
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://mon_user:mon_password@db:5432/elaviradb
    depends_on:
      - db
      - ollama
    restart: always

  frontend:
    build: 
      context: ../formeduc-react
      dockerfile: Dockerfile
    container_name: elavira-frontend-1
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://104.254.182.118:8000
    depends_on:
      - backend
    restart: always


volumes:
  postgres_data:
  ollama_models: